<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>I Am YE</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #490000;
            color: #ffd3a0;
            font-family: Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 6em;
            animation: drop-in 1000ms;
        }

        h2 {
            font-size: 3em;
            font-weight: bold;
        }

        button {
            font-size: 1em;
            background: rgba(0, 0, 0, 0);
            border: rgba(0, 0, 0, 0);
            color: #ffd3a0;
            font-family: Helvetica, sans-serif;
        }

        @keyframes drop-in {
            from {
                opacity: 0;
                transform: translateY(-2em);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drop-in-from-left {
            from {
                opacity: 0;
                transform: translateX(-5em);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes drop-in-from-right {
            from {
                opacity: 0;
                transform: translateX(5em);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #title {
            padding: 10px;
        }

        .info-card-quote {
            background: rgba(0, 0, 0, 0.479);
            border: 2px solid #ffd3a0;
            padding: 20px 90px;
            border-radius: 18px;
            width: fit-content;
            max-width: 25vw;
            word-wrap: break-word;
        }

        .info-card-album {
            background: rgba(0, 0, 0, 0.479);
            border: 2px solid #ffd3a0;
            padding: 20px 90px;
            border-radius: 18px;
            width: fit-content;
            max-width: 25vw;
        }

    </style>
</head>

<body>
    <h1 id="title">I AM YE.</h1>

    <div style="text-align: center; animation: drop-in 1000ms;">
        <img src="assets/pngegg.png" alt="Ye Ye Boi">
    </div>

    <div id="Quotes" class="info-card-quote" style="margin-top: -50vh; margin-left: 4vw; animation: drop-in-from-left 1000ms;">
        <h2 style="text-align: center;">
            <button id="quoteButton" type="button">Ye's Quote Button</button>
        </h2>
        <p id="quoteDisplay" style="text-align: center; font-size: 2em; font-family: Helvetica, sans-serif;">Time to get Kanye Blessed</p>
        
        <div style="text-align: center;">
            <img src="assets/KW1.png" alt="Ye Ye Boi">
        </div>
    </div>

    <div id="NextAlbum" class="info-card-album" style="margin-top: -50vh; margin-left: 65vw; animation: drop-in-from-right 1000ms;">
        <h2 style="text-align: center;">Your Next Kanye Album: </h2>

        <div id="album-display" style="text-align: center;">
            <p style="text-align: center; font-size: 2em; font-family: Helvetica, sans-serif;">Loading Album....</p>
        </div>
    </div>
</body>

<script>
    const quoteButton = document.querySelector("#quoteButton");
    const quoteDisplay = document.querySelector("#quoteDisplay");

    quoteButton.addEventListener("click", async () => {
        quoteButton.disabled = true;
        quoteButton.textContent = "Loading....";

        try {
            let singleWordQuote = null;
            while (!singleWordQuote) {
                const response = await fetch("https://api.kanye.rest/");
                if (!response.ok) {
                    throw new Error(`Request Failed: ${response.status}`);
                }

                const data = await response.json();
                
                const words = data.quote.trim().split(/\s+/);
                
                if (words.length <= 7) {
                    singleWordQuote = data.quote;
                }
            }

            quoteDisplay.textContent = `"${singleWordQuote}"`;

        } catch (error) {
            console.error("Couldn't load a quote: ", error);
            quoteDisplay.textContent = "Couldn't load a quote. Click here to try again";
        } finally {
            quoteButton.disabled = false;
            quoteButton.textContent = "Ye's Quote Button";
        }
});
    window.addEventListener("DOMContentLoaded", async () => {
        const albumDisplay = document.querySelector("#album-display");
        
        const kanyeAlbums = [
            {
                title: "The College Dropout (2004)",
                art: "https://upload.wikimedia.org/wikipedia/en/a/a3/Kanye_West_-_The_College_Dropout.jpg"
            },
            {
                title: "Late Registration (2005)",
                art: "https://upload.wikimedia.org/wikipedia/en/f/f4/Late_Registration_by_Kanye_West.jpg"
            },
            {
                title: "Graduation (2007)",
                art: "https://upload.wikimedia.org/wikipedia/en/7/70/Graduation_album_cover.jpg"
            },
            {
                title: "808s & Heartbreak (2008)",
                art: "https://upload.wikimedia.org/wikipedia/en/f/f1/808s_%26_Heartbreak.png"
            },
            {
                title: "My Beautiful Dark Twisted Fantasy (2010)",
                art: "https://upload.wikimedia.org/wikipedia/en/b/be/MBDTF_ALT.jpg"
            },
            {
                title: "Yeezus (2013)",
                art: "https://upload.wikimedia.org/wikipedia/en/0/03/Yeezus_album_cover.png"
            },
            {
                title: "The Life of Pablo (2016)",
                art: "https://upload.wikimedia.org/wikipedia/en/4/4d/The_life_of_pablo.jpg"
            },
            {
                title: "ye (2018)",
                art: "https://upload.wikimedia.org/wikipedia/en/7/74/Ye_album_cover.jpg"
            },
            {
                title: "Jesus Is King (2019)",
                art: "https://upload.wikimedia.org/wikipedia/en/a/a4/Jesus_Is_King_Kanye_West.png"
            },
            {
                title: "Donda (2021)",
                art: "https://upload.wikimedia.org/wikipedia/en/7/77/Kanye_West_-_Donda.png"
            },
            {
                title: "Donda 2 (2022)",
                art: "https://upload.wikimedia.org/wikipedia/en/a/ad/Donda_2_cover.png"
            },
            {
                title: "Bully (2026)",
                art: "https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg"
            },
            // Collaborative Studio Albums
            {
                title: "Watch the Throne (2011)",
                art: "https://upload.wikimedia.org/wikipedia/en/c/c8/Watch_the_Throne.jpg"
            },
            {
                title: "Kids See Ghosts (2018)",
                art: "https://upload.wikimedia.org/wikipedia/en/a/a5/Kids_See_Ghosts_Album_Cover.jpg"
            },
            {
                title: "Vultures 1 (2024)",
                art: "https://upload.wikimedia.org/wikipedia/en/7/73/Vultures_1_cover.jpg"
            },
            {
                title: "Vultures 2 (2024)",
                art: "https://upload.wikimedia.org/wikipedia/en/3/36/Vultures_2_cover.png"
            }
        ];

        try {
            const randomIndex = Math.floor(Math.random() * kanyeAlbums.length);
            const randomAlbum = kanyeAlbums[randomIndex];

            albumDisplay.innerHTML = `
                <img src="${randomAlbum.art}" alt="${randomAlbum.title}" style="width: 550px; height: 550px; border-radius: 8px; border: 2px solid #ffd3a0; object-fit: cover;">
                <p style="margin-top: 10px; font-weight: bold; font-size: 1.2em;">${randomAlbum.title}</p>
            `;
        } catch (error) {
            console.error("Couldn't load album: ", error);
            albumDisplay.textContent = "Couldn't Load Album Art";
        }
    });
</script>
