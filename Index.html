<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>I Am YE</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #490000;
            color: #ffd3a0;
            font-family: Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 6em;
            animation: drop-in 1000ms;
        }

        @keyframes drop-in {
            from {
                opacity: 0;
                transform: translateY(-1em);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #title {
            padding: 10px;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.479);
            border: 2px solid #ffd3a0;
            padding: 15px 25px;
            border-radius: 8px;
            min-width: 300px;
        }

    </style>
</head>
<body>
    <h1 id="title">I AM YE.</h1>
    <div style="text-align: center; animation: drop-in 1000ms;">
        <img src="assets/pngegg.png" alt="Ye Ye Boi">
    </div>
</body>
