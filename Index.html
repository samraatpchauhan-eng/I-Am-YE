<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>I Am YE</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #490000;
            color: #ffd3a0;
            font-family: Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 6em;
            animation: drop-in 1000ms;
        }

        h2 {
            font-size: 3em;
        }

        @keyframes drop-in {
            from {
                opacity: 0;
                transform: translateY(-2em);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drop-in-from-left {
            from {
                opacity: 0;
                transform: translateX(-5em);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #title {
            padding: 10px;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.479);
            border: 2px solid #ffd3a0;
            padding: 20px 90px;
            border-radius: 18px;
            width: fit-content;
        }

    </style>
</head>
<body>
    <h1 id="title">I AM YE.</h1>
    <div style="text-align: center; animation: drop-in 1000ms;">
        <img src="assets/pngegg.png" alt="Ye Ye Boi">
    </div>

    <div id="Quotes" class="info-card" style="margin-top: -50vh; margin-left: 4vw; animation: drop-in-from-left 1000ms;">
        <h2 style="text-align: center;">Click Here for Quotes</h2>
        <div style="text-align: center;">
            <img src="assets/KW1.png" alt="Ye Ye Boi">
        </div>
    </div>
</body>
