<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>I Am YE</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #490000;
            color: #ffd3a0;
            font-family: Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 4em;
            animation: drop-in 900ms;
        }

        @keyframes drop-in {
            from {
                opacity: 0;
                transform: translateY(-1em);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>
    <h1>I AM YE.</h1>
</body>
